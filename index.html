<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050b1b">
  <meta name="description" content="EgyBook — تواصل، شارك، اكتشف أكثر">
  <title>EgyBook | تواصل، شارك، اكتشف أكثر</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <a class="brand" href="#" aria-label="EgyBook الرئيسية"><span class="brand-egy">Egy</span><span class="brand-book">Book</span><i class="brand-glow"></i></a>
      <div class="top-actions">
        <button class="icon-btn" aria-label="بحث" title="بحث">⌕</button>
        <button class="icon-btn message-icon" aria-label="الرسائل" title="الرسائل" id="messagesBtn"><span class="chat-glyph">···</span><b class="badge">3</b></button>
        <button class="icon-btn" aria-label="الإشعارات" title="الإشعارات">♧</button>
        <button class="avatar avatar-small" aria-label="حسابي">ح</button>
      </div>
    </header>

    <nav class="section-tabs" aria-label="أقسام التطبيق">
      <button class="tab active" data-tab="الرئيسية">⌂ <span>الرئيسية</span></button>
      <button class="tab" data-tab="الأصدقاء">♧ <span>الأصدقاء</span></button>
      <button class="tab" data-tab="اكتشف">✧ <span>اكتشف</span></button>
      <button class="tab" data-tab="الريلز">▷ <span>الريلز</span></button>
      <button class="tab" data-tab="المحفوظات">▣ <span>المحفوظات</span></button>
    </nav>

    <main>
      <section class="composer panel">
        <div class="composer-top">
          <div class="avatar">ح</div>
          <button class="composer-input" id="openComposer">بتفكر في إيه؟ شارك أصحابك...</button>
        </div>
        <div class="composer-tools">
          <button data-compose="صورة">▧ <span>صورة</span></button>
          <button data-compose="فيديو">▷ <span>فيديو</span></button>
          <button data-compose="موقع">⌖ <span>موقع</span></button>
          <button data-compose="مزاج">♫ <span>مزاج</span></button>
        </div>
      </section>

      <section class="stories-section">
        <div class="section-heading"><h2>القصص</h2><button class="text-btn">عرض الكل ←</button></div>
        <div class="stories-row">
          <button class="story add-story"><span class="story-ring plus">＋</span><span>قصتك</span></button>
          <button class="story"><span class="story-ring story-egypt">𓂀</span><span>القاهرة</span></button>
          <button class="story"><span class="story-ring story-purple">ن</span><span>Nour</span></button>
          <button class="story"><span class="story-ring story-cyan">ع</span><span>Ahmed</span></button>
          <button class="story"><span class="story-ring story-pink">س</span><span>Salma</span></button>
          <button class="story"><span class="story-ring story-blue">م</span><span>مروان</span></button>
        </div>
      </section>

      <section class="feed-section">
        <div class="section-heading"><h2>آخر المنشورات</h2><button class="text-btn" id="sortBtn">الأحدث ⌄</button></div>
        <article class="post panel">
          <header class="post-header">
            <div class="avatar avatar-photo">أ</div>
            <div class="post-author"><strong>Ahmed Mostafa <span class="verified">✓</span></strong><small>القاهرة، مصر · منذ 12 دقيقة · ◉</small></div>
            <button class="more-btn" aria-label="المزيد">•••</button>
          </header>
          <p class="post-copy">غروب القاهرة له حكاية تانية 💙🇪🇬 مين نفسه يروح يتمشى على النيل النهارده؟</p>
          <div class="post-art" role="img" aria-label="مشهد فني لغروب القاهرة والنيل">
            <div class="sun"></div><div class="pyramid pyramid-one"></div><div class="pyramid pyramid-two"></div>
            <div class="cityline"></div><div class="river"></div><div class="boat">⛵</div>
            <span class="art-caption">CAIRO · EGYPT</span>
          </div>
          <div class="post-stats"><span>💙 ٢٫٤ ألف</span><span>٣٢٠ تعليق · ٨٥ مشاركة</span></div>
          <div class="post-actions">
            <button class="like-btn">♡ <span>إعجاب</span></button>
            <button class="comment-btn">▱ <span>تعليق</span></button>
            <button class="share-btn">↗ <span>مشاركة</span></button>
            <button class="save-btn" aria-label="حفظ المنشور">♧</button>
          </div>
          <div class="comment-preview"><span class="mini-avatar">ن</span><span>نور: الصورة جميلة جدًا 😍</span></div>
        </article>
      </section>
    </main>

    <nav class="bottom-nav" aria-label="التنقل الرئيسي">
      <button class="bottom-item selected" data-tab="الرئيسية"><span>⌂</span><small>الرئيسية</small></button>
      <button class="bottom-item" data-tab="اكتشف"><span>✧</span><small>اكتشف</small></button>
      <button class="create-fab" id="fab" aria-label="إنشاء">＋</button>
      <button class="bottom-item" data-tab="الرسائل" id="bottomMessages"><span class="bottom-chat">▱</span><small>الرسائل</small><b class="bottom-badge">3</b></button>
      <button class="bottom-item" data-tab="حسابي"><span>♙</span><small>حسابي</small></button>
    </nav>
  </div>

  <dialog id="composerDialog" class="composer-dialog">
    <form method="dialog" class="dialog-card" id="postForm">
      <div class="dialog-heading"><h2>منشور جديد</h2><button class="close-dialog" aria-label="إغلاق">×</button></div>
      <textarea id="postText" placeholder="شارك لحظتك مع EgyBook..." rows="4"></textarea>
      <div class="dialog-tools"><span>▧ صورة</span><span>▷ فيديو</span><span>⌖ موقع</span></div>
      <button class="primary-btn" id="publishBtn" value="publish">نشر المنشور</button>
    </form>
  </dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="script.js"></script>
</body>
</html>
